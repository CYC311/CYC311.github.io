<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GrandAbyss Sovereign Matrix v7.5 | 奧米加昇華版</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/11.8.0/math.js"></script>
    <style>
        /* 核心視覺變數庫 */
        :root {
            --bg-deep: #02040a; --bg-panel: #0d1117; --bg-card: #161b22;
            --brd-main: #30363d; --brd-glow: rgba(56, 189, 248, 0.4);
            --txt-main: #c9d1d9; --txt-mut: #8b949e; --txt-lit: #f0f6fc;
            --accent-math: #38bdf8; --accent-phys: #34d399; --accent-chem: #fbbf24; 
            --accent-music: #f472b6; --accent-gacha: #a78bfa;
        }

        /* 基礎全域設定 */
        * { box-sizing: border-box; }
        body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg-deep); color: var(--txt-main); margin: 0; padding: 20px; line-height: 1.6; }
        .wrapper { max-width: 1600px; margin: 0 auto; }
        
        /* 頂部標題 */
        header { text-align: center; margin-bottom: 30px; border-bottom: 1px solid var(--brd-main); padding-bottom: 20px; }
        header h1 { font-size: clamp(1.8em, 4vw, 3em); color: var(--txt-lit); margin: 0; text-transform: uppercase; letter-spacing: 4px; text-shadow: 0 0 20px var(--brd-glow); }
        header p { color: var(--txt-mut); font-size: 1.1em; letter-spacing: 1px; }

        /* 導航標籤系統 */
        .nav-container { display: flex; gap: 10px; margin-bottom: 20px; border-bottom: 2px solid var(--brd-main); padding-bottom: 5px; overflow-x: auto; scrollbar-width: thin; }
        .nav-btn { background: transparent; border: none; color: var(--txt-mut); font-size: 1.1em; font-weight: 700; padding: 12px 24px; cursor: pointer; border-radius: 8px 8px 0 0; transition: all 0.3s ease; white-space: nowrap; }
        .nav-btn:hover { color: var(--txt-lit); background: rgba(255,255,255,0.05); }
        
        /* 動態顏色綁定 */
        .nav-btn.active[data-target="m-math"] { color: var(--accent-math); border-bottom: 3px solid var(--accent-math); background: rgba(56, 189, 248, 0.1); }
        .nav-btn.active[data-target="m-phys"] { color: var(--accent-phys); border-bottom: 3px solid var(--accent-phys); background: rgba(52, 211, 153, 0.1); }
        .nav-btn.active[data-target="m-chem"] { color: var(--accent-chem); border-bottom: 3px solid var(--accent-chem); background: rgba(251, 191, 36, 0.1); }
        .nav-btn.active[data-target="m-music"] { color: var(--accent-music); border-bottom: 3px solid var(--accent-music); background: rgba(244, 114, 182, 0.1); }
        .nav-btn.active[data-target="m-gacha"] { color: var(--accent-gacha); border-bottom: 3px solid var(--accent-gacha); background: rgba(167, 139, 250, 0.1); }

        /* 面板與網格系統 */
        .panel { display: none; animation: fadeIn 0.4s ease-out; }
        .panel.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        .grid-layout { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 20px; margin-bottom: 40px; }
        
        /* 卡片設計 */
        .card { background: var(--bg-card); border: 1px solid var(--brd-main); border-radius: 12px; padding: 20px; box-shadow: 0 8px 24px rgba(0,0,0,0.5); position: relative; transition: border-color 0.2s; display: flex; flex-direction: column; }
        .card:hover { border-color: rgba(255,255,255,0.2); }
        .card::before { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 4px; border-radius: 12px 12px 0 0; }
        .card.m-card::before { background: var(--accent-math); }
        .card.p-card::before { background: var(--accent-phys); }
        .card.c-card::before { background: var(--accent-chem); }
        .card.mu-card::before { background: var(--accent-music); }
        .card.g-card::before { background: var(--accent-gacha); }
        
        .card h3 { margin: 0 0 15px 0; font-size: 1.2em; border-bottom: 1px dashed var(--brd-main); padding-bottom: 10px; }
        .card.m-card h3 { color: var(--accent-math); } .card.p-card h3 { color: var(--accent-phys); }
        .card.c-card h3 { color: var(--accent-chem); } .card.mu-card h3 { color: var(--accent-music); }
        .card.g-card h3 { color: var(--accent-gacha); }

        /* 表單元件 */
        .form-group { margin-bottom: 12px; }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        label { display: block; font-size: 0.85em; color: var(--txt-mut); margin-bottom: 4px; font-weight: 600; }
        input, select { width: 100%; background: var(--bg-deep); border: 1px solid var(--brd-main); color: var(--txt-lit); padding: 10px; border-radius: 6px; font-family: 'Consolas', monospace; outline: none; transition: 0.3s; }
        input:focus, select:focus { border-color: var(--txt-mut); box-shadow: 0 0 8px rgba(255,255,255,0.1); }
        
        /* 執行按鈕 */
        .btn-exec { width: 100%; border: none; padding: 12px; border-radius: 6px; font-weight: bold; font-size: 1em; cursor: pointer; transition: all 0.2s; margin-top: auto; text-transform: uppercase; letter-spacing: 1px; color: #000; }
        .btn-exec:active { transform: scale(0.98); }
        .btn-math { background: var(--accent-math); } .btn-phys { background: var(--accent-phys); }
        .btn-chem { background: var(--accent-chem); } .btn-music { background: var(--accent-music); }
        .btn-gacha { background: var(--accent-gacha); }

        /* 獨立結果觀測窗 (新UI核心) */
        .result-box { margin-top: 15px; padding: 15px; background: rgba(1, 4, 9, 0.8); border-radius: 8px; font-family: 'Consolas', monospace; font-size: 0.95em; white-space: pre-wrap; display: none; line-height: 1.5; border-left: 4px solid; box-shadow: inset 0 0 10px rgba(0,0,0,0.5); }
        .result-box.active { display: block; animation: expandDown 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        @keyframes expandDown { from { opacity: 0; transform: scaleY(0.9); transform-origin: top; } to { opacity: 1; transform: scaleY(1); transform-origin: top; } }
        
        .m-card .result-box { border-left-color: var(--accent-math); color: #e5f5ff; }
        .p-card .result-box { border-left-color: var(--accent-phys); color: #e6fffa; }
        .c-card .result-box { border-left-color: var(--accent-chem); color: #fffbeb; }
        .mu-card .result-box { border-left-color: var(--accent-music); color: #fdf2f8; }
        .g-card .result-box { border-left-color: var(--accent-gacha); color: #f5f3ff; }
        
        .highlight { font-weight: bold; padding: 0 4px; border-radius: 3px; background: rgba(255,255,255,0.1); }
        .err { color: #ff7b72; font-weight: bold; }

        /* 滾動條美化 */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg-deep); }
        ::-webkit-scrollbar-thumb { background: var(--brd-main); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--txt-mut); }
    </style>
</head>
<body>

<div class="wrapper">
    <header>
        <h1>GrandAbyss Sovereign Matrix</h1>
        <p>Omnipotent Calculation Engine v7.5 | 模組化直觀演算樞紐</p>
    </header>

    <div class="nav-container" id="main-nav">
        <button class="nav-btn active" data-target="m-math" onclick="switchModule('m-math')">Σ 數學矩陣</button>
        <button class="nav-btn" data-target="m-phys" onclick="switchModule('m-phys')">Φ 物理引擎</button>
        <button class="nav-btn" data-target="m-chem" onclick="switchModule('m-chem')">Δ 化學動力</button>
        <button class="nav-btn" data-target="m-music" onclick="switchModule('m-music')">♫ 聲學樂理</button>
        <button class="nav-btn" data-target="m-gacha" onclick="switchModule('m-gacha')">Ω 抽卡機率</button>
    </div>

    <div id="m-math" class="panel active">
        <div class="grid-layout">
            <div class="card m-card">
                <h3>一元二次公式解</h3>
                <div class="form-row">
                    <div class="form-group"><label>二次項 a:</label><input type="number" id="m_quad_a" value="1"></div>
                    <div class="form-group"><label>一次項 b:</label><input type="number" id="m_quad_b" value="-5"></div>
                </div>
                <div class="form-group"><label>常數項 c:</label><input type="number" id="m_quad_c" value="6"></div>
                <button class="btn-exec btn-math" onclick="MathEngine.solveQuadratic('res_quad')">執行化簡</button>
                <div class="result-box" id="res_quad"></div>
            </div>

            <div class="card m-card">
                <h3>函數切線推導 (微積分)</h3>
                <div class="form-group"><label>多項式 f(x):</label><input type="text" id="m_poly_f" value="x^3 - 4*x^2 + x + 6"></div>
                <div class="form-group"><label>切點 x = c:</label><input type="number" id="m_poly_c" value="2"></div>
                <button class="btn-exec btn-math" onclick="MathEngine.calcCalculus('res_calc')">推導切線</button>
                <div class="result-box" id="res_calc"></div>
            </div>

            <div class="card m-card">
                <h3>空間向量外積與力矩</h3>
                <div class="form-group"><label>向量 A (x, y, z):</label><input type="text" id="m_vec_a" value="2, 3, -1"></div>
                <div class="form-group"><label>向量 B (x, y, z):</label><input type="text" id="m_vec_b" value="1, -2, 4"></div>
                <button class="btn-exec btn-math" onclick="MathEngine.calcCrossProduct('res_cross')">計算外積</button>
                <div class="result-box" id="res_cross"></div>
            </div>

            <div class="card m-card">
                <h3>圓與直線距離解析</h3>
                <div class="form-group"><label>圓心 (h, k) 與 半徑 r:</label><input type="text" id="m_circle" value="0, 0, 5"></div>
                <div class="form-group"><label>直線 ax + by + c = 0:</label><input type="text" id="m_line" value="3, -4, 15"></div>
                <button class="btn-exec btn-math" onclick="MathEngine.calcCircleLine('res_circle')">計算幾何關係</button>
                <div class="result-box" id="res_circle"></div>
            </div>
            
            <div class="card m-card">
                <h3>貝氏定理 (條件機率)</h3>
                <div class="form-row">
                    <div class="form-group"><label>P(A) 先驗:</label><input type="number" id="m_bayes_pa" value="0.01" step="0.01"></div>
                    <div class="form-group"><label>P(B|A) 準確度:</label><input type="number" id="m_bayes_pba" value="0.99" step="0.01"></div>
                </div>
                <div class="form-group"><label>P(B|A') 誤報率:</label><input type="number" id="m_bayes_pbfa" value="0.05" step="0.01"></div>
                <button class="btn-exec btn-math" onclick="MathEngine.calcBayes('res_bayes')">解算後驗機率</button>
                <div class="result-box" id="res_bayes"></div>
            </div>
        </div>
    </div>

    <div id="m-phys" class="panel">
        <div class="grid-layout">
            <div class="card p-card">
                <h3>二維拋物線運動</h3>
                <div class="form-row">
                    <div class="form-group"><label>初速 v0 (m/s):</label><input type="number" id="p_proj_v" value="20"></div>
                    <div class="form-group"><label>仰角 θ (度):</label><input type="number" id="p_proj_deg" value="45"></div>
                </div>
                <div class="form-group"><label>重力 g:</label><input type="number" id="p_proj_g" value="9.81" step="0.01"></div>
                <button class="btn-exec btn-phys" onclick="PhysEngine.calcProjectile('res_proj')">計算飛行軌跡</button>
                <div class="result-box" id="res_proj"></div>
            </div>

            <div class="card p-card">
                <h3>一維完全彈性碰撞</h3>
                <div class="form-row">
                    <div class="form-group"><label>m1(kg), v1(m/s):</label><input type="text" id="p_col_1" value="2, 5"></div>
                    <div class="form-group"><label>m2(kg), v2(m/s):</label><input type="text" id="p_col_2" value="3, -4"></div>
                </div>
                <button class="btn-exec btn-phys" onclick="PhysEngine.calcCollision('res_col')">計算末速</button>
                <div class="result-box" id="res_col"></div>
            </div>

            <div class="card p-card">
                <h3>電磁學：洛倫茲力</h3>
                <div class="form-group"><label>電荷 q (C):</label><input type="text" id="p_em_q" value="1.6e-19"></div>
                <div class="form-row">
                    <div class="form-group"><label>速度 v (m/s):</label><input type="text" id="p_em_v" value="1e5"></div>
                    <div class="form-group"><label>磁場 B (T):</label><input type="text" id="p_em_b" value="0.5"></div>
                </div>
                <div class="form-group"><label>夾角 θ (度):</label><input type="number" id="p_em_deg" value="90"></div>
                <button class="btn-exec btn-phys" onclick="PhysEngine.calcLorentz('res_lor')">計算受力</button>
                <div class="result-box" id="res_lor"></div>
            </div>
        </div>
    </div>

    <div id="m-chem" class="panel">
        <div class="grid-layout">
            <div class="card c-card">
                <h3>基態原子軌域組態</h3>
                <div class="form-group"><label>原子序 Z (1~36):</label><input type="number" id="c_elec_z" value="29"></div>
                <button class="btn-exec btn-chem" onclick="ChemEngine.calcElectron('res_elec')">推演排列</button>
                <div class="result-box" id="res_elec"></div>
            </div>

            <div class="card c-card">
                <h3>反應速率動力學</h3>
                <div class="form-row">
                    <div class="form-group"><label>速率常數 k:</label><input type="number" id="c_rate_k" value="0.05"></div>
                    <div class="form-group"><label>[A] 濃度 M:</label><input type="number" id="c_rate_a" value="0.1"></div>
                </div>
                <div class="form-row">
                    <div class="form-group"><label>A 級數 m:</label><input type="number" id="c_rate_m" value="1"></div>
                    <div class="form-group"><label>B 級數 n:</label><input type="number" id="c_rate_n" value="2"></div>
                </div>
                <div class="form-group"><label>[B] 濃度 M:</label><input type="number" id="c_rate_b" value="0.2"></div>
                <button class="btn-exec btn-chem" onclick="ChemEngine.calcKinetics('res_kinetics')">計算瞬時速率</button>
                <div class="result-box" id="res_kinetics"></div>
            </div>
        </div>
    </div>

    <div id="m-music" class="panel">
        <div class="grid-layout">
            <div class="card mu-card">
                <h3>自然大調和弦級數解析</h3>
                <div class="form-group">
                    <label>選擇大調主音 (Root Key):</label>
                    <select id="mu_key">
                        <option value="C">C Major</option><option value="G">G Major</option>
                        <option value="D">D Major</option><option value="A">A Major</option>
                        <option value="F">F Major</option><option value="Bb">Bb Major</option>
                    </select>
                </div>
                <button class="btn-exec btn-music" onclick="MusicEngine.calcChords('res_chord')">生成 I-VII 級和弦表</button>
                <div class="result-box" id="res_chord"></div>
            </div>
        </div>
    </div>

    <div id="m-gacha" class="panel">
        <div class="grid-layout">
            
            <div class="card g-card">
                <h3>基礎理論機率</h3>
                <div class="form-row">
                    <div class="form-group"><label>單抽機率 (%):</label><input type="number" id="g_theo_rate" value="0.6" step="0.1"></div>
                    <div class="form-group"><label>預計抽數:</label><input type="number" id="g_theo_pulls" value="50"></div>
                </div>
                <button class="btn-exec btn-gacha" onclick="GachaEngine.calcTheoretical('res_theo')">計算至少中獎率</button>
                <div class="result-box" id="res_theo"></div>
            </div>

            <div class="card g-card" style="grid-column: 1 / -1;">
                <h3>高階蒙地卡羅動態模擬器 (抽數規劃專用)</h3>
                <div class="form-row">
                    <div class="form-group"><label>基礎率 (例如 0.6%):</label><input type="number" id="g_sim_base" value="0.6" step="0.1"></div>
                    <div class="form-group"><label>硬保底抽數 (例如 90):</label><input type="number" id="g_sim_hard" value="90"></div>
                    <div class="form-group"><label>軟保底起始 (例如 73):</label><input type="number" id="g_sim_soft" value="73"></div>
                    <div class="form-group">
                        <label>卡池類型 (UP機率):</label>
                        <select id="g_sim_up">
                            <option value="50">角色池 (50/50)</option>
                            <option value="75">武器/光錐池 (75/25)</option>
                            <option value="100">必中池 (100%)</option>
                        </select>
                    </div>
                </div>
                <hr style="border:0; border-top:1px dashed var(--brd-main); margin: 10px 0;">
                <div class="form-row">
                    <div class="form-group"><label style="color:#a78bfa;">🎯 目標要抽幾隻 (命座/星魂+1):</label><input type="number" id="g_sim_target" value="1" min="1" max="7"></div>
                    <div class="form-group"><label style="color:#a78bfa;">📦 目前已墊抽數:</label><input type="number" id="g_sim_current_pity" value="0" min="0"></div>
                    <div class="form-group">
                        <label style="color:#a78bfa;">🛡️ 下一金是否必定大保底:</label>
                        <select id="g_sim_guarantee">
                            <option value="false">否 (小保底)</option>
                            <option value="true">是 (大保底)</option>
                        </select>
                    </div>
                    <div class="form-group"><label>樣本數 (建議 10萬):</label><input type="number" id="g_sim_count" value="100000"></div>
                </div>
                <button class="btn-exec btn-gacha" id="btn_gacha_sim" onclick="GachaEngine.runAdvancedSimulation('res_sim')">啟動 100,000 次平行宇宙推演</button>
                <div class="result-box" id="res_sim" style="font-size: 1.05em;"></div>
            </div>
        </div>
    </div>

</div>

<script>
    // ================= 核心 UI 邏輯 =================
    function switchModule(targetId) {
        document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
        document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(targetId).classList.add('active');
        document.querySelector(`.nav-btn[data-target="${targetId}"]`).classList.add('active');
    }

    // 全新專屬顯示函數
    function printResult(elementId, content, isError = false) {
        const el = document.getElementById(elementId);
        if (isError) {
            el.innerHTML = `<span class="err">⚠ 運算錯誤: ${content}</span>`;
        } else {
            el.innerHTML = content;
        }
        el.classList.add('active');
    }

    // ================= 數學引擎 =================
    const MathEngine = {
        solveQuadratic: (resId) => {
            const a = +document.getElementById('m_quad_a').value;
            const b = +document.getElementById('m_quad_b').value;
            const c = +document.getElementById('m_quad_c').value;
            if(a === 0) return printResult(resId, "二次項係數不能為 0", true);
            const D = b*b - 4*a*c;
            let out = `方程式: ${a}x² + ${b}x + ${c} = 0\n判別式 Δ = ${D}\n\n`;
            if (D > 0) out += `實數雙根: \nx1 = <span class="highlight">${((-b+Math.sqrt(D))/(2*a)).toFixed(4)}</span>\nx2 = <span class="highlight">${((-b-Math.sqrt(D))/(2*a)).toFixed(4)}</span>`;
            else if (D === 0) out += `重根: x = <span class="highlight">${-b/(2*a)}</span>`;
            else out += `共軛虛根: x = <span class="highlight">${-b/(2*a)} ± ${Math.sqrt(Math.abs(D))/(2*a)}i</span>`;
            printResult(resId, out);
        },
        calcCalculus: (resId) => {
            try {
                const expr = document.getElementById('m_poly_f').value;
                const c = +document.getElementById('m_poly_c').value;
                const fc = math.evaluate(expr, {x: c});
                const deriv = math.derivative(expr, 'x');
                const slope = deriv.evaluate({x: c});
                printResult(resId, `函數 f(x) = ${expr}\n導函數 f'(x) = ${deriv.toString()}\n切點: (${c}, ${fc})\n切線斜率 m = ${slope}\n\n切線方程式:\n<span class="highlight">y = ${slope}x + ${fc - slope*c}</span>`);
            } catch (e) { printResult(resId, "微積分解析失敗，請確認多項式格式。", true); }
        },
        calcCrossProduct: (resId) => {
            try {
                const A = document.getElementById('m_vec_a').value.split(',').map(Number);
                const B = document.getElementById('m_vec_b').value.split(',').map(Number);
                const cross = [ A[1]*B[2]-A[2]*B[1], A[2]*B[0]-A[0]*B[2], A[0]*B[1]-A[1]*B[0] ];
                printResult(resId, `A = (${A})\nB = (${B})\n\n外積 A × B = <span class="highlight">(${cross.join(', ')})</span>`);
            } catch (e) { printResult(resId, "格式錯誤，請使用逗號分隔。", true); }
        },
        calcCircleLine: (resId) => {
            const [h, k, r] = document.getElementById('m_circle').value.split(',').map(Number);
            const [a, b, c] = document.getElementById('m_line').value.split(',').map(Number);
            const dist = Math.abs(a*h + b*k + c) / Math.sqrt(a*a + b*b);
            let relation = "";
            if (dist > r) relation = "相離 (無交點)";
            else if (dist === r) relation = "相切 (1交點)";
            else relation = `相割 (2交點), 弦長 = ${(2 * Math.sqrt(r*r - dist*dist)).toFixed(3)}`;
            printResult(resId, `圓心距 d = ${dist.toFixed(3)}, 半徑 r = ${r}\n關係: <span class="highlight">${relation}</span>`);
        },
        calcBayes: (resId) => {
            const pa = +document.getElementById('m_bayes_pa').value;
            const pba = +document.getElementById('m_bayes_pba').value;
            const pbfa = +document.getElementById('m_bayes_pbfa').value;
            const pb = (pba * pa) + (pbfa * (1 - pa)); 
            const pab = (pba * pa) / pb;
            printResult(resId, `全機率 P(B) = ${pb.toFixed(4)}\n後驗機率 P(A|B) = <span class="highlight">${(pab*100).toFixed(2)}%</span>`);
        }
    };

    // ================= 物理引擎 =================
    const PhysEngine = {
        calcProjectile: (resId) => {
            const v0 = +document.getElementById('p_proj_v').value;
            const theta = +document.getElementById('p_proj_deg').value * (Math.PI / 180);
            const g = +document.getElementById('p_proj_g').value;
            const v0x = v0 * Math.cos(theta); const v0y = v0 * Math.sin(theta);
            printResult(resId, `Vx: ${v0x.toFixed(2)} m/s, Vy: ${v0y.toFixed(2)} m/s\n飛行時間 t = <span class="highlight">${((2 * v0y) / g).toFixed(2)} s</span>\n最大高度 H = <span class="highlight">${((v0y * v0y) / (2 * g)).toFixed(2)} m</span>\n水平射程 R = <span class="highlight">${(v0x * ((2 * v0y) / g)).toFixed(2)} m</span>`);
        },
        calcCollision: (resId) => {
            const [m1, v1] = document.getElementById('p_col_1').value.split(',').map(Number);
            const [m2, v2] = document.getElementById('p_col_2').value.split(',').map(Number);
            const v1f = ((m1-m2)*v1 + 2*m2*v2)/(m1+m2);
            const v2f = ((m2-m1)*v2 + 2*m1*v1)/(m1+m2);
            printResult(resId, `m1 末速 = <span class="highlight">${v1f.toFixed(2)} m/s</span>\nm2 末速 = <span class="highlight">${v2f.toFixed(2)} m/s</span>`);
        },
        calcLorentz: (resId) => {
            const q = +document.getElementById('p_em_q').value;
            const v = +document.getElementById('p_em_v').value;
            const B = +document.getElementById('p_em_b').value;
            const theta = +document.getElementById('p_em_deg').value * (Math.PI / 180);
            const F = q * v * B * Math.sin(theta);
            printResult(resId, `公式: F = qvB sin(θ)\n磁力 F = <span class="highlight">${F.toExponential(4)} N</span>`);
        }
    };

    // ================= 化學與音樂引擎 =================
    const ChemEngine = {
        calcElectron: (resId) => {
            const Z = +document.getElementById('c_elec_z').value;
            if(Z < 1 || Z > 36) return printResult(resId, "僅支援 Z=1~36", true);
            const orbs = [{n:'1s',m:2}, {n:'2s',m:2}, {n:'2p',m:6}, {n:'3s',m:2}, {n:'3p',m:6}, {n:'4s',m:2}, {n:'3d',m:10}, {n:'4p',m:6}];
            let rem = Z, res = [];
            for (let o of orbs) {
                if (rem <= 0) break;
                let fill = Math.min(rem, o.m);
                if (Z === 24 && o.n === '4s') fill = 1; if (Z === 24 && o.n === '3d') fill = 5;
                if (Z === 29 && o.n === '4s') fill = 1; if (Z === 29 && o.n === '3d') fill = 10;
                res.push(`${o.n}<sup>${fill}</sup>`); rem -= fill;
            }
            printResult(resId, `Z = ${Z} 電子組態:\n<span class="highlight">${res.join(' ')}</span>`);
        },
        calcKinetics: (resId) => {
            const k = +document.getElementById('c_rate_k').value;
            const a = +document.getElementById('c_rate_a').value, m = +document.getElementById('c_rate_m').value;
            const b = +document.getElementById('c_rate_b').value, n = +document.getElementById('c_rate_n').value;
            const rate = k * Math.pow(a, m) * Math.pow(b, n);
            printResult(resId, `反應總級數 = ${m+n}\n瞬時速率 R = <span class="highlight">${rate.toExponential(4)} M/s</span>`);
        }
    };

    const MusicEngine = {
        calcChords: (resId) => {
            const root = document.getElementById('mu_key').value;
            const notes = ['C','C#','D','D#','E','F','F#','G','G#','A','Bb','B'];
            const rootIdx = notes.indexOf(root);
            const scale = [0, 2, 4, 5, 7, 9, 11].map(i => notes[(rootIdx + i) % 12]);
            const chords = [`I: ${scale[0]} Maj`, `ii: ${scale[1]} min`, `iii: ${scale[2]} min`, `IV: ${scale[3]} Maj`, `V: ${scale[4]} Maj`, `vi: ${scale[5]} min`, `vii°: ${scale[6]} dim`];
            printResult(resId, `${root} 大調順階和弦:\n<span class="highlight">${chords.join('  |  ')}</span>`);
        }
    };

    // ================= 抽卡機率 (全面進化的動態規劃) =================
    const GachaEngine = {
        calcTheoretical: (resId) => {
            const p = +document.getElementById('g_theo_rate').value / 100;
            const n = +document.getElementById('g_theo_pulls').value;
            const prob = 1 - Math.pow(1 - p, n);
            printResult(resId, `${n} 抽內至少出金一次的純機率 = <span class="highlight">${(prob*100).toFixed(2)}%</span>`);
        },
        
        runAdvancedSimulation: (resId) => {
            const btn = document.getElementById('btn_gacha_sim');
            btn.innerText = "演算中..."; btn.disabled = true;

            setTimeout(() => {
                const baseRate = +document.getElementById('g_sim_base').value / 100;
                const hardPity = +document.getElementById('g_sim_hard').value;
                const softPity = +document.getElementById('g_sim_soft').value;
                const upRate = +document.getElementById('g_sim_up').value / 100;
                const targetCopies = +document.getElementById('g_sim_target').value;
                const initialPity = +document.getElementById('g_sim_current_pity').value;
                const initialGuarantee = document.getElementById('g_sim_guarantee').value === "true";
                const iterations = +document.getElementById('g_sim_count').value;

                const pityStep = (1.0 - baseRate) / (hardPity - softPity + 1);
                let totalPullsArray = new Int32Array(iterations);

                // 執行蒙地卡羅迴圈
                for(let i=0; i<iterations; i++) {
                    let copies = 0;
                    let pullsThisRun = 0;
                    let currentPity = initialPity;
                    let hasGuarantee = initialGuarantee;

                    while(copies < targetCopies) {
                        currentPity++;
                        pullsThisRun++;
                        let currentRate = baseRate;
                        
                        if (currentPity >= softPity) currentRate += (currentPity - softPity + 1) * pityStep;
                        if (currentPity >= hardPity) currentRate = 1.0;

                        if (Math.random() <= currentRate) {
                            if (hasGuarantee || Math.random() <= upRate) {
                                copies++; // 抽到目標 UP
                                hasGuarantee = false;
                            } else {
                                hasGuarantee = true; // 歪了
                            }
                            currentPity = 0;
                        }
                    }
                    totalPullsArray[i] = pullsThisRun;
                }

                // 統計分析
                totalPullsArray.sort();
                let sum = 0;
                for(let i=0; i<iterations; i++) sum += totalPullsArray[i];
                
                const avgPulls = sum / iterations;
                const medianPulls = totalPullsArray[Math.floor(iterations * 0.5)];
                const p10 = totalPullsArray[Math.floor(iterations * 0.1)];  // 歐皇前10%
                const p90 = totalPullsArray[Math.floor(iterations * 0.9)];  // 非酋前90%
                const maxPulls = totalPullsArray[iterations - 1];

                const resultHTML = 
                    `✅ 模擬完成 (${iterations.toLocaleString()} 次宇宙推演)\n` +
                    `──────── 目標: 獲得 ${targetCopies} 隻 UP ────────\n` +
                    `平均期望抽數: <span class="highlight" style="color:#a78bfa">${avgPulls.toFixed(1)} 抽</span> (原石/星瓊預算參考)\n` +
                    `50% 玩家達標: <span class="highlight">${medianPulls} 抽</span> (正常運氣中位數)\n` +
                    `90% 安全水位: <span class="highlight">${p90} 抽</span> (準備這麼多基本穩拿)\n\n` +
                    `[趣味數據] 歐皇10%只需 ${p10} 抽，最非紀錄為 ${maxPulls} 抽。`;

                printResult(resId, resultHTML);
                btn.innerText = "啟動 100,000 次平行宇宙推演"; btn.disabled = false;
            }, 50);
        }
    };
</script>
