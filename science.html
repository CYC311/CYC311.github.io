<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>元素週期表填空練習</title>
    <style>
        :root {
            --bg-color: #f0f2f5;
            --cell-bg: #ffffff;
            --accent-color: #3498db;
            --correct-color: #2ecc71;
            --wrong-color: #e74c3c;
            --text-main: #2c3e50;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
            margin: 0;
        }

        .header { text-align: center; margin-bottom: 30px; }
        .header h1 { margin: 0; font-size: 2.5rem; color: #1a2a3a; }
        .header p { color: #7f8c8d; }

        .periodic-table {
            display: grid;
            grid-template-columns: repeat(18, 55px);
            grid-template-rows: repeat(7, 65px);
            gap: 6px;
            background: #e0e0e0;
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            overflow-x: auto;
        }

        .cell {
            background-color: transparent;
            border-radius: 4px;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* 僅顯示需要填寫的格子 */
        .target-cell {
            background-color: var(--cell-bg);
            border: 2px solid #bdc3c7;
            transition: all 0.3s ease;
        }

        .target-cell:focus-within {
            border-color: var(--accent-color);
            box-shadow: 0 0 8px rgba(52, 152, 219, 0.3);
        }

        .atomic-number {
            font-size: 10px;
            margin: 4px 0 0 5px;
            color: #95a5a6;
        }

        input {
            width: 100%;
            height: 100%;
            border: none;
            background: transparent;
            text-align: center;
            font-size: 18px;
            font-weight: bold;
            color: var(--text-main);
            outline: none;
            text-transform: capitalize;
        }

        /* 狀態顏色 */
        .correct { background-color: var(--correct-color) !important; border-color: #27ae60 !important; }
        .correct input { color: white; }
        .correct .atomic-number { color: rgba(255,255,255,0.8); }

        .wrong { background-color: var(--wrong-color) !important; border-color: #c0392b !important; }
        .wrong input { color: white; }
        .wrong .atomic-number { color: rgba(255,255,255,0.8); }

        .btn-group { margin-top: 30px; display: flex; gap: 15px; }
        button {
            padding: 12px 25px;
            font-size: 16px;
            font-weight: 600;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.2s, background 0.2s;
        }
        .btn-check { background: var(--accent-color); color: white; }
        .btn-check:hover { background: #2980b9; transform: translateY(-2px); }
        .btn-reset { background: #95a5a6; color: white; }
        .btn-reset:hover { background: #7f8c8d; }

        .legend {
            margin-top: 20px;
            font-size: 0.9rem;
            color: #7f8c8d;
            background: white;
            padding: 10px 20px;
            border-radius: 20px;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>化學元素挑戰</h1>
        <p>請填寫 1A-8A 族及第三週期的元素符號</p>
    </div>

    <div id="table" class="periodic-table"></div>

    <div class="btn-group">
        <button class="btn-check" onclick="checkAnswers()">檢查正確率</button>
        <button class="btn-reset" onclick="resetTable()">清空重來代碼</button>
    </div>

    <div class="legend">提示：輸入不分大小寫 (如: na 或 Na)</div>

    <script>
        const elementsData = {
            "1-1": { s: "H", n: 1 },    "1-18": { s: "He", n: 2 },
            "2-1": { s: "Li", n: 3 },   "2-2": { s: "Be", n: 4 },  "2-13": { s: "B", n: 5 },   "2-14": { s: "C", n: 6 },   "2-15": { s: "N", n: 7 },   "2-16": { s: "O", n: 8 },   "2-17": { s: "F", n: 9 },   "2-18": { s: "Ne", n: 10 },
            "3-1": { s: "Na", n: 11 },  "3-2": { s: "Mg", n: 12 }, "3-13": { s: "Al", n: 13 }, "3-14": { s: "Si", n: 14 }, "3-15": { s: "P", n: 15 },  "3-16": { s: "S", n: 16 },  "3-17": { s: "Cl", n: 17 }, "3-18": { s: "Ar", n: 18 },
            "4-1": { s: "K", n: 19 },   "4-2": { s: "Ca", n: 20 }, "4-13": { s: "Ga", n: 31 }, "4-14": { s: "Ge", n: 32 }, "4-15": { s: "As", n: 33 }, "4-16": { s: "Se", n: 34 }, "4-17": { s: "Br", n: 35 }, "4-18": { s: "Kr", n: 36 },
            "5-1": { s: "Rb", n: 37 },  "5-2": { s: "Sr", n: 38 }, "5-13": { s: "In", n: 49 }, "5-14": { s: "Sn", n: 50 }, "5-15": { s: "Sb", n: 51 }, "5-16": { s: "Te", n: 52 }, "5-17": { s: "I", n: 53 },  "5-18": { s: "Xe", n: 54 },
            "6-1": { s: "Cs", n: 55 },  "6-2": { s: "Ba", n: 56 }, "6-13": { s: "Tl", n: 81 }, "6-14": { s: "Pb", n: 82 }, "6-15": { s: "Bi", n: 83 }, "6-16": { s: "Po", n: 84 }, "6-17": { s: "At", n: 85 }, "6-18": { s: "Rn", n: 86 },
            "7-1": { s: "Fr", n: 87 },  "7-2": { s: "Ra", n: 88 }, "7-13": { s: "Nh", n: 113 }, "7-14": { s: "Fl", n: 114 }, "7-15": { s: "Mc", n: 115 }, "7-16": { s: "Lv", n: 116 }, "7-17": { s: "Ts", n: 117 }, "7-18": { s: "Og", n: 118 }
        };

        const targetGroups = [1, 2, 13, 14, 15, 16, 17, 18];
        const targetPeriod = 3;

        function init() {
            const table = document.getElementById('table');
            table.innerHTML = '';
            for (let r = 1; r <= 7; r++) {
                for (let c = 1; c <= 18; c++) {
                    const pos = `${r}-${c}`;
                    const cell = document.createElement('div');
                    cell.className = 'cell';
                    
                    if (targetGroups.includes(c) || r === targetPeriod) {
                        const data = elementsData[pos];
                        if (data) {
                            cell.classList.add('target-cell');
                            cell.innerHTML = `
                                <div class="atomic-number">${data.n}</div>
                                <input type="text" id="input-${pos}" autocomplete="off">
                            `;
                        }
                    }
                    table.appendChild(cell);
                }
            }
        }

        function checkAnswers() {
            let score = 0;
            let total = 0;
            for (let key in elementsData) {
                const input = document.getElementById(`input-${key}`);
                if (input) {
                    total++;
                    const userVal = input.value.trim().toLowerCase();
                    const correctVal = elementsData[key].s.toLowerCase();
                    
                    if (userVal === correctVal) {
                        input.parentElement.classList.add('correct');
                        input.parentElement.classList.remove('wrong');
                        score++;
                    } else {
                        input.parentElement.classList.add('wrong');
                        input.parentElement.classList.remove('correct');
                    }
                }
            }
            alert(`完成！你的得分是：${score} / ${total}`);
        }

        function resetTable() {
            init();
        }

        init();
    </script>
</body>
</html>
