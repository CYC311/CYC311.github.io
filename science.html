<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>終極元素週期表填空挑戰</title>
    <style>
        :root {
            --bg: #f8f9fa;
            --cell-size: 45px;
            --correct: #27ae60;
            --wrong: #e74c3c;
        }
        body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); display: flex; flex-direction: column; align-items: center; padding: 20px; }
        .controls { margin-bottom: 20px; position: sticky; top: 10px; z-index: 100; background: white; padding: 15px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        
        /* 週期表網格設定 */
        .periodic-table {
            display: grid;
            grid-template-columns: repeat(18, var(--cell-size));
            grid-template-rows: repeat(10, calc(var(--cell-size) * 1.2));
            gap: 4px;
            padding: 10px;
        }

        .cell {
            background: white;
            border: 1px solid #ddd;
            display: flex;
            flex-direction: column;
            position: relative;
            transition: 0.2s;
        }

        /* 隱藏非元素格子 */
        .empty { visibility: hidden; }

        /* 標示鑭系錒系位置 */
        .la-ac-place { background: #eee; border-style: dashed; }

        .num { font-size: 9px; margin: 2px 0 0 3px; color: #888; pointer-events: none; }
        input {
            width: 100%; height: 100%; border: none; background: transparent;
            text-align: center; font-size: 14px; font-weight: bold; outline: none;
            text-transform: capitalize;
        }

        /* 顏色反饋 */
        .correct { background: var(--correct); color: white; border-color: var(--correct); }
        .wrong { background: var(--wrong); color: white; border-color: var(--wrong); }
        .correct .num, .wrong .num { color: rgba(255,255,255,0.7); }
        .correct input, .wrong input { color: white; }

        button { padding: 8px 16px; cursor: pointer; border-radius: 5px; border: none; font-weight: bold; margin: 0 5px; }
        .check-btn { background: #3498db; color: white; }
        .reset-btn { background: #e67e22; color: white; }
        
        /* 鑭系錒系間隔 */
        .spacer { grid-row: 8 / 9; height: 20px; }
    </style>
</head>
<body>

    <div class="controls">
        <h2 style="margin:0 0 10px 0">118元素全挑戰</h2>
        <button class="check-btn" onclick="checkAll()">提交檢查</button>
        <button class="reset-btn" onclick="location.reload()">重新開始</button>
        <span id="score" style="margin-left: 15px; font-weight: bold;"></span>
    </div>

    <div id="table" class="periodic-table"></div>

    <script>
        // 完整的元素資料：[原子序, 符號, 列, 行]
        const elements = [
            [1,"H",1,1],[2,"He",1,18],
            [3,"Li",2,1],[4,"Be",2,2],[5,"B",2,13],[6,"C",2,14],[7,"N",2,15],[8,"O",2,16],[9,"F",2,17],[10,"Ne",2,18],
            [11,"Na",3,1],[12,"Mg",3,2],[13,"Al",3,13],[14,"Si",3,14],[15,"P",3,15],[16,"S",3,16],[17,"Cl",3,17],[18,"Ar",3,18],
            [19,"K",4,1],[20,"Ca",4,2],[21,"Sc",4,3],[22,"Ti",4,4],[23,"V",4,5],[24,"Cr",4,6],[25,"Mn",4,7],[26,"Fe",4,8],[27,"Co",4,9],[28,"Ni",4,10],[29,"Cu",4,11],[30,"Zn",4,12],[31,"Ga",4,13],[32,"Ge",4,14],[33,"As",4,15],[34,"Se",4,16],[35,"Br",4,17],[36,"Kr",4,18],
            [37,"Rb",5,1],[38,"Sr",5,2],[39,"Y",5,3],[40,"Zr",5,4],[41,"Nb",5,5],[42,"Mo",5,6],[43,"Tc",5,7],[44,"Ru",5,8],[45,"Rh",5,9],[46,"Pd",5,10],[47,"Ag",5,11],[48,"Cd",5,12],[49,"In",5,13],[50,"Sn",5,14],[51,"Sb",5,15],[52,"Te",5,16],[53,"I",5,17],[54,"Xe",5,18],
            [55,"Cs",6,1],[56,"Ba",6,2],/*57-71*/ [72,"Hf",6,4],[73,"Ta",6,5],[74,"W",6,6],[75,"Re",6,7],[76,"Os",6,8],[77,"Ir",6,9],[78,"Pt",6,10],[79,"Au",6,11],[80,"Hg",6,12],[81,"Tl",6,13],[82,"Pb",6,14],[83,"Bi",6,15],[84,"Po",6,16],[85,"At",6,17],[86,"Rn",6,18],
            [87,"Fr",7,1],[88,"Ra",7,2],/*89-103*/[104,"Rf",7,4],[105,"Db",7,5],[106,"Sg",7,6],[107,"Bh",7,7],[108,"Hs",7,8],[109,"Mt",7,9],[110,"Ds",7,10],[111,"Rg",7,11],[112,"Cn",7,12],[113,"Nh",7,13],[114,"Fl",7,14],[115,"Mc",7,15],[116,"Lv",7,16],[117,"Ts",7,17],[118,"Og",7,18],
            // 鑭系 (放在第9列)
            [57,"La",9,4],[58,"Ce",9,5],[59,"Pr",9,6],[60,"Nd",9,7],[61,"Pm",9,8],[62,"Sm",9,9],[63,"Eu",9,10],[64,"Gd",9,11],[65,"Tb",9,12],[66,"Dy",9,13],[67,"Ho",9,14],[68,"Er",9,15],[69,"Tm",9,16],[70,"Yb",9,17],[71,"Lu",9,18],
            // 錒系 (放在第10列)
            [89,"Ac",10,4],[90,"Th",10,5],[91,"Pa",10,6],[92,"U",10,7],[93,"Np",10,8],[94,"Pu",10,9],[95,"Am",10,10],[96,"Cm",10,11],[97,"Bk",10,12],[98,"Cf",10,13],[99,"Es",10,14],[100,"Fm",10,15],[101,"Md",10,16],[102,"No",10,17],[103,"Lr",10,18]
        ];

        const container = document.getElementById('table');

        function createGrid() {
            // 初始化 18x10 的空格子
            const grid = Array.from({length: 10}, () => Array(18).fill(null));
            
            elements.forEach(el => {
                const [num, sym, r, c] = el;
                const cell = document.createElement('div');
                cell.className = 'cell';
                cell.style.gridRow = r;
                cell.style.gridColumn = c;
                cell.innerHTML = `<div class="num">${num}</div><input type="text" data-ans="${sym}" maxlength="2">`;
                container.appendChild(cell);
            });
        }

        function checkAll() {
            let correctCount = 0;
            const inputs = document.querySelectorAll('input');
            inputs.forEach(input => {
                const userVal = input.value.trim().toLowerCase();
                const ans = input.dataset.ans.toLowerCase();
                const parent = input.parentElement;
                
                if (userVal === ans) {
                    parent.classList.add('correct');
                    parent.classList.remove('wrong');
                    correctCount++;
                } else {
                    parent.classList.add('wrong');
                    parent.classList.remove('correct');
                }
            });
            document.getElementById('score').innerText = `得分：${correctCount} / 118`;
        }

        createGrid();
    </script>
</body>
</html>
