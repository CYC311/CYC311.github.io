<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>元素週期表填空：第四週期與主族</title>
    <style>
        :root {
            --bg-color: #f5f6fa;
            --cell-bg: #ffffff;
            --accent: #4a90e2;
            --correct: #2ecc71;
            --wrong: #e74c3c;
        }
        body { font-family: system-ui, sans-serif; background: var(--bg-color); display: flex; flex-direction: column; align-items: center; padding: 40px; }
        .grid {
            display: grid;
            grid-template-columns: repeat(18, 55px);
            grid-template-rows: repeat(7, 65px);
            gap: 6px;
            background: #dfe6e9;
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
        }
        .cell { background: transparent; border-radius: 4px; display: flex; flex-direction: column; position: relative; }
        .target { background: var(--cell-bg); border: 2px solid #b2bec3; transition: 0.3s; }
        .target:focus-within { border-color: var(--accent); transform: scale(1.05); z-index: 10; }
        .num { font-size: 10px; margin: 4px 0 0 5px; color: #636e72; }
        input {
            width: 100%; height: 100%; border: none; background: transparent;
            text-align: center; font-size: 18px; font-weight: bold; outline: none;
            text-transform: capitalize;
        }
        .correct { background: var(--correct) !important; color: white; border-color: #27ae60; }
        .wrong { background: var(--wrong) !important; color: white; border-color: #c0392b; }
        .correct input, .wrong input, .correct .num, .wrong .num { color: white; }
        .btns { margin-top: 30px; }
        button { padding: 12px 24px; font-size: 16px; border: none; border-radius: 6px; cursor: pointer; color: white; margin: 0 10px; }
    </style>
</head>

    <div id="table" class="grid"></div>

        <button style="background: var(--accent)" onclick="check()">檢查答案</button>
        <button style="background: #95a5a6" onclick="location.reload()">重新開始</button>
    </div>
