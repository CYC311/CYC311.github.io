<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>元素週期表自主測試</title>
    <style>
        body { font-family: sans-serif; background-color: #f4f7f6; display: flex; flex-direction: column; align-items: center; padding: 20px; }
        h2 { color: #2c3e50; }
        .grid-container {
            display: grid;
            grid-template-columns: repeat(18, 50px);
            grid-template-rows: repeat(7, 60px);
            gap: 5px;
            background: white;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .cell {
            border: 1px solid #ccc;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            background-color: #fafafa;
        }
        .active-cell { background-color: #e8f4fd; border: 2px solid #3498db; }
        input {
            width: 80%;
            border: none;
            background: transparent;
            text-align: center;
            font-size: 16px;
            font-weight: bold;
            outline: none;
        }
        .correct { background-color: #2ecc71 !important; color: white; }
        .wrong { background-color: #e74c3c !important; color: white; }
        .label { font-size: 10px; color: #7f8c8d; margin-bottom: 2px; }
        .controls { margin-top: 20px; }
        button { padding: 10px 20px; cursor: pointer; background: #3498db; color: white; border: none; border-radius: 5px; }
        button:hover { background: #2980b9; }
    </style>
</head>
<body>

    <h2>元素週期表填空練習 (1A-8A & 第三週期)</h2>
    <div id="table" class="grid-container"></div>

    <div class="controls">
        <button onclick="checkAnswers()">檢查答案</button>
        <button onclick="resetTable()" style="background:#95a5a6">重置</button>
    </div>

    <script>
        const elements = {
            "1-1": "H",  "1-18": "He",
            "2-1": "Li", "2-2": "Be", "2-13": "B", "2-14": "C", "2-15": "N", "2-16": "O", "2-17": "F", "2-18": "Ne",
            "3-1": "Na", "3-2": "Mg", "3-13": "Al", "3-14": "Si", "3-15": "P", "3-16": "S", "3-17": "Cl", "3-18": "Ar",
            "4-1": "K",  "4-2": "Ca", "4-13": "Ga", "4-14": "Ge", "4-15": "As", "4-16": "Se", "4-17": "Br", "4-18": "Kr",
            "5-1": "Rb", "5-2": "Sr", "5-13": "In", "5-14": "Sn", "5-15": "Sb", "5-16": "Te", "5-17": "I",  "5-18": "Xe",
            "6-1": "Cs", "6-2": "Ba", "6-13": "Tl", "6-14": "Pb", "6-15": "Bi", "6-16": "Po", "6-17": "At", "6-18": "Rn",
            "7-1": "Fr", "7-2": "Ra", "7-13": "Nh", "7-14": "Fl", "7-15": "Mc", "7-16": "Lv", "7-17": "Ts", "7-18": "Og"
        };

        const targetGroups = [1, 2, 13, 14, 15, 16, 17, 18];
        const targetPeriod = 3;

        function createTable() {
            const tableDiv = document.getElementById('table');
            for (let r = 1; r <= 7; r++) {
                for (let c = 1; c <= 18; c++) {
                    const cell = document.createElement('div');
                    cell.className = 'cell';
                    const pos = `${r}-${c}`;
                    
                    // 判斷是否為使用者需要填寫的區域
                    if (targetGroups.includes(c) || r === targetPeriod) {
                        if (elements[pos]) {
                            cell.classList.add('active-cell');
                            cell.innerHTML = `<span class="label">${pos}</span><input type="text" id="input-${pos}" maxlength="2">`;
                        }
                    }
                    tableDiv.appendChild(cell);
                }
            }
        }

        function checkAnswers() {
            for (let key in elements) {
                const input = document.getElementById(`input-${key}`);
                if (input) {
                    if (input.value.trim().toLowerCase() === elements[key].toLowerCase()) {
                        input.parentElement.className = 'cell correct';
                    } else {
                        input.parentElement.className = 'cell wrong';
                    }
                }
            }
        }

        function resetTable() {
            document.getElementById('table').innerHTML = '';
            createTable();
        }

        createTable();
    </script>
</body>
</html>
