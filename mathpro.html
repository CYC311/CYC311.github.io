<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GrandAbyss 綜合分析引擎 Ultimate</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/11.8.0/math.js"></script>
    <style>
        :root {
            --bg-color: #0f172a; --panel-bg: #1e293b; --text-color: #f8fafc;
            --accent: #38bdf8; --accent-hover: #0284c7; --accent-alt: #10b981;
            --accent-warn: #f59e0b; --border: #334155;
        }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: var(--bg-color); color: var(--text-color); margin: 0; padding: 20px; line-height: 1.6; }
        h1 { text-align: center; color: var(--accent); letter-spacing: 2px;}
        .container { max-width: 1100px; margin: 0 auto; }
        .tabs { display: flex; margin-bottom: 20px; border-bottom: 2px solid var(--border); overflow-x: auto; }
        .tab-btn { background: transparent; color: var(--text-color); border: none; padding: 10px 20px; font-size: 1.1em; cursor: pointer; transition: 0.3s; white-space: nowrap; }
        .tab-btn.active { border-bottom: 3px solid var(--accent); color: var(--accent); font-weight: bold; }
        .panel { display: none; background: var(--panel-bg); padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        .panel.active { display: block; animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        .input-group { margin-bottom: 12px; display: flex; align-items: center; }
        .input-group label { flex: 1.2; font-weight: bold; font-size: 0.95em; }
        .input-group input, .input-group textarea, .input-group select {
            flex: 1.5; padding: 8px; background: var(--bg-color); border: 1px solid var(--border);
            color: white; border-radius: 4px; font-family: monospace; width: 100%; box-sizing: border-box;
        }
        button.calc-btn {
            background: var(--accent); color: white; border: none; padding: 10px 20px;
            border-radius: 4px; cursor: pointer; font-size: 1em; width: 100%; margin-top: 10px; font-weight: bold; transition: 0.2s;
        }
        button.calc-btn:hover { background: var(--accent-hover); }
        .btn-alt { background: var(--accent-alt) !important; }
        .btn-alt:hover { filter: brightness(1.1); }
        .btn-warn { background: var(--accent-warn) !important; }
        .btn-warn:hover { filter: brightness(1.1); }
        .result-box {
            margin-top: 20px; padding: 15px; background: rgba(56, 189, 248, 0.05);
            border-left: 4px solid var(--accent); border-radius: 4px; white-space: pre-wrap; font-family: monospace; font-size: 1.05em;
        }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 25px; }
        .section-box { border: 1px solid var(--border); padding: 15px; border-radius: 6px; }
        h3 { margin-top: 0; color: #cbd5e1; border-bottom: 1px dashed var(--border); padding-bottom: 5px; }
        @media (max-width: 768px) { .grid-2 { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

<div class="container">
    <h1>GrandAbyss 綜合分析引擎</h1>
    
    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('math')">高階數學與學測專區</button>
        <button class="tab-btn" onclick="switchTab('science')">物理化學與科學</button>
        <button class="tab-btn" onclick="switchTab('gacha')">泛用抽卡引擎</button>
    </div>

    <div id="math" class="panel active">
        <div class="grid-2">
            <div class="section-box">
                <h3>微積分與函數分析</h3>
                <div class="input-group"><label>函數 f(x):</label><input type="text" id="math-func" value="x^3 - 2*x + sin(x)"></div>
                <div class="input-group"><label>計算點 x = </label><input type="number" id="math-x" value="2"></div>
                <button class="calc-btn" onclick="calcMath()">執行函數分析</button>
            </div>
            <div class="section-box">
                <h3>空間向量 (共面與歪斜距離)</h3>
                <div class="input-group"><label>P1P2 (x,y,z):</label><input type="text" id="vec-1" value="1, 0, 1"></div>
                <div class="input-group"><label>方向 d1 (x,y,z):</label><input type="text" id="vec-2" value="0, 1, 1"></div>
                <div class="input-group"><label>方向 d2 (x,y,z):</label><input type="text" id="vec-3" value="1, -1, 0"></div>
                <button class="calc-btn" onclick="calcVector()">計算向量屬性</button>
            </div>
            <div class="section-box" style="grid-column: 1 / -1;">
                <h3 style="color: var(--accent-warn);">學測專區：二維數據分析 (相關係數與迴歸線)</h3>
                <div class="input-group"><label>X 變量數據 (逗號隔開):</label><input type="text" id="stat-x" value="1, 2, 3, 4, 5"></div>
                <div class="input-group"><label>Y 變量數據 (逗號隔開):</label><input type="text" id="stat-y" value="2, 3, 5, 4, 6"></div>
                <button class="calc-btn btn-warn" onclick="calcStats()">執行二維數據分析</button>
            </div>
        </div>
        <div id="math-result" class="result-box">等待計算...</div>
    </div>

    <div id="science" class="panel">
        <div class="grid-2">
            <div class="section-box">
                <h3>物理：運動學 (斜拋運動)</h3>
                <div class="input-group"><label>初速 v₀ (m/s):</label><input type="number" id="phys-v0" value="20"></div>
                <div class="input-group"><label>仰角 θ (度):</label><input type="number" id="phys-theta" value="45"></div>
                <div class="input-group"><label>重力 g (m/s²):</label><input type="number" id="phys-g" value="9.8" step="0.1"></div>
                <button class="calc-btn btn-alt" onclick="calcKinematics()">計算軌跡參數</button>
            </div>
            <div class="section-box">
                <h3>化學：理想氣體 (PV=nRT)</h3>
                <p style="font-size:0.8em; margin:0 0 10px 0; color:#94a3b8;">將要求解的變數填入「?」，R預設為 0.082</p>
                <div class="input-group"><label>壓力 P (atm):</label><input type="text" id="chem-p" value="1"></div>
                <div class="input-group"><label>體積 V (L):</label><input type="text" id="chem-v" value="?"></div>
                <div class="input-group"><label>莫耳數 n (mol):</label><input type="text" id="chem-n" value="2"></div>
                <div class="input-group"><label>溫度 T (K):</label><input type="text" id="chem-t" value="300"></div>
                <button class="calc-btn btn-alt" onclick="calcGas()">求解狀態方程式</button>
            </div>
            <div class="section-box" style="grid-column: 1 / -1;">
                <h3>實驗：A 類不確定度評估</h3>
                <div class="input-group"><label>測量數據:</label><input type="text" id="sci-data" value="10.2, 10.4, 10.1, 10.3, 10.5"></div>
                <button class="calc-btn btn-alt" onclick="calcUncertainty()">計算不確定度</button>
            </div>
        </div>
        <div id="science-result" class="result-box" style="border-left-color: var(--accent-alt);">等待計算...</div>
    </div>

    <div id="gacha" class="panel">
        <p style="font-size: 0.9em; color: #94a3b8; margin-top:0;">支援各種保底機制之無窮期望值數學模型。</p>
        <div class="grid-2">
            <div class="section-box">
                <h3>基礎機制設定</h3>
                <div class="input-group"><label>基礎機率 (%):</label><input type="number" id="g-base" value="0.8" step="0.1"></div>
                <div class="input-group"><label>硬保底抽數:</label><input type="number" id="g-hard" value="80"></div>
                <div class="input-group"><label>大獎 UP 機率 (%):</label><input type="number" id="g-up-rate" value="50"></div>
                <div class="input-group"><label>小獎後必出大獎次數:</label><input type="number" id="g-guarantee" value="1"></div>
            </div>
            <div class="section-box">
                <h3>動態軟保底設定 (Soft Pity)</h3>
                <div class="input-group">
                    <label>軟保底模式:</label>
                    <select id="g-pity-type">
                        <option value="step">逐步提升 (例:原神/鳴潮)</option>
                        <option value="fixed">單次固定提升 (達標後機率鎖定)</option>
                        <option value="none">無軟保底 (僅靠硬保底)</option>
                    </select>
                </div>
                <div class="input-group"><label>軟保底起始抽數:</label><input type="number" id="g-soft-start" value="65"></div>
                <div class="input-group"><label>提升機率參數 (%):<br><small>(逐步步長 或 固定增加值)</small></label><input type="number" id="g-soft-step" value="6.0" step="0.1"></div>
            </div>
            <div class="section-box" style="grid-column: 1 / -1;">
                <div class="input-group" style="margin:0;"><label style="font-size: 1.1em; color: var(--accent);">預計投入總抽數:</label><input type="number" id="g-pulls" value="160" style="font-size: 1.1em; font-weight: bold;"></div>
            </div>
        </div>
        <button class="calc-btn" onclick="calcGacha()">進行泛用機率解析</button>
        <div id="gacha-result" class="result-box">等待計算...</div>
    </div>
</div>

<script>
    function switchTab(tabId) {
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        document.querySelectorAll('.panel').forEach(panel => panel.classList.remove('active'));
        event.target.classList.add('active');
        document.getElementById(tabId).classList.add('active');
    }

    // --- 數學與學測引擎 ---
    function calcMath() {
        try {
            const funcStr = document.getElementById('math-func').value;
            const xVal = parseFloat(document.getElementById('math-x').value);
            const node = math.parse(funcStr);
            const fx = node.evaluate({x: xVal});
            const derivative = math.derivative(funcStr, 'x').evaluate({x: xVal});
            document.getElementById('math-result').innerText = `【函數分析】\nf(${xVal}) = ${fx.toFixed(4)}\nf'(${xVal}) = ${derivative.toFixed(4)}`;
        } catch (e) { document.getElementById('math-result').innerText = "數學表達式錯誤！"; }
    }

    function calcVector() {
        try {
            const p = (str) => str.split(',').map(Number);
            const v1 = p(document.getElementById('vec-1').value), v2 = p(document.getElementById('vec-2').value), v3 = p(document.getElementById('vec-3').value);
            const det = math.det([v1, v2, v3]);
            const crossMagnitude = math.norm(math.cross(v2, v3));
            let res = `【空間向量分析】\nDet = ${det.toFixed(4)}\n|d1 x d2| = ${crossMagnitude.toFixed(4)}\n`;
            if (Math.abs(det) < 1e-9) res += "狀態：共面 (相交)\n最短距離：0";
            else res += `狀態：歪斜\n最短距離 = ${ (Math.abs(det) / crossMagnitude).toFixed(4) }`;
            document.getElementById('math-result').innerText = res;
        } catch (e) { document.getElementById('math-result').innerText = "向量格式錯誤！"; }
    }

    function calcStats() {
        try {
            const xArr = document.getElementById('stat-x').value.split(',').map(Number);
            const yArr = document.getElementById('stat-y').value.split(',').map(Number);
            if(xArr.length !== yArr.length || xArr.length < 2) throw "長度不符";
            
            const n = xArr.length;
            const meanX = math.mean(xArr), meanY = math.mean(yArr);
            const stdX = math.std(xArr, 'uncorrected'), stdY = math.std(yArr, 'uncorrected');
            
            let cov = 0;
            for(let i=0; i<n; i++) cov += (xArr[i]-meanX)*(yArr[i]-meanY);
            cov /= n;
            
            const r = cov / (stdX * stdY);
            const m = r * (stdY / stdX);
            const k = meanY - m * meanX;
            
            document.getElementById('math-result').innerText = 
                `【二維數據分析 (學測)】\n數據對數 (n) = ${n}\n`+
                `X 平均 = ${meanX.toFixed(2)}, X 標差 = ${stdX.toFixed(2)}\n`+
                `Y 平均 = ${meanY.toFixed(2)}, Y 標差 = ${stdY.toFixed(2)}\n`+
                `相關係數 r = ${r.toFixed(4)}\n`+
                `迴歸線方程式：y = ${m.toFixed(4)}x + ${k.toFixed(4)}`;
        } catch (e) { document.getElementById('math-result').innerText = "數據解析錯誤，請確保X與Y數量相同。"; }
    }

    // --- 科學與物化引擎 ---
    function calcKinematics() {
        const v0 = parseFloat(document.getElementById('phys-v0').value);
        const theta = parseFloat(document.getElementById('phys-theta').value) * Math.PI / 180;
        const g = parseFloat(document.getElementById('phys-g').value);
        
        const h = Math.pow(v0 * Math.sin(theta), 2) / (2 * g);
        const r = (Math.pow(v0, 2) * Math.sin(2 * theta)) / g;
        const t = (2 * v0 * Math.sin(theta)) / g;
        
        document.getElementById('science-result').innerText = 
            `【斜拋運動分析】\n初速: ${v0} m/s, 仰角: ${(theta*180/Math.PI).toFixed(1)}°\n\n`+
            `最大高度 (H) = ${h.toFixed(2)} m\n水平射程 (R) = ${r.toFixed(2)} m\n飛行時間 (T) = ${t.toFixed(2)} s`;
    }

    function calcGas() {
        const p = document.getElementById('chem-p').value.trim();
        const v = document.getElementById('chem-v').value.trim();
        const n = document.getElementById('chem-n').value.trim();
        const t = document.getElementById('chem-t').value.trim();
        const R = 0.082;
        let res = "";

        try {
            if(p === '?') res = `壓力 P = ${ ((parseFloat(n)*R*parseFloat(t))/parseFloat(v)).toFixed(4) } atm`;
            else if(v === '?') res = `體積 V = ${ ((parseFloat(n)*R*parseFloat(t))/parseFloat(p)).toFixed(4) } L`;
            else if(n === '?') res = `莫耳數 n = ${ ((parseFloat(p)*parseFloat(v))/(R*parseFloat(t))).toFixed(4) } mol`;
            else if(t === '?') res = `溫度 T = ${ ((parseFloat(p)*parseFloat(v))/(parseFloat(n)*R)).toFixed(2) } K`;
            else res = "請在要求解的欄位填入 '?'";
            document.getElementById('science-result').innerText = `【理想氣體 PV=nRT】\nR 帶入 0.082\n計算結果：\n${res}`;
        } catch(e) { document.getElementById('science-result').innerText = "輸入格式錯誤"; }
    }

    function calcUncertainty() {
        try {
            const data = document.getElementById('sci-data').value.split(',').map(n => parseFloat(n.trim())).filter(n => !isNaN(n));
            const mean = math.mean(data);
            const std = math.std(data, 'unbiased'); 
            const typeA = std / Math.sqrt(data.length);
            document.getElementById('science-result').innerText = `【A類不確定度】\n平均值 = ${mean.toFixed(4)}\n樣本標差 = ${std.toFixed(4)}\nu_A = ${typeA.toFixed(4)}`;
        } catch (e) { document.getElementById('science-result').innerText = "數據解析錯誤"; }
    }

    // --- 泛用抽卡引擎 ---
    function calcGacha() {
        const baseRate = parseFloat(document.getElementById('g-base').value)/100;
        const hardPity = parseInt(document.getElementById('g-hard').value);
        const pityType = document.getElementById('g-pity-type').value;
        const softStart = parseInt(document.getElementById('g-soft-start').value);
        const softStep = parseFloat(document.getElementById('g-soft-step').value)/100;
        
        const upRate = parseFloat(document.getElementById('g-up-rate').value)/100;
        const guarantee = parseInt(document.getElementById('g-guarantee').value);
        const totalPulls = parseInt(document.getElementById('g-pulls').value);

        let expPullsAny = 0; let cumProb = 1;
        
        for (let i = 1; i <= hardPity; i++) {
            let currentRate = baseRate;
            
            // 軟保底機制判斷
            if (i >= softStart) {
                if (pityType === 'step') {
                    currentRate = baseRate + (i - softStart + 1) * softStep;
                } else if (pityType === 'fixed') {
                    currentRate = baseRate + softStep; // 固定提升
                }
            }
            
            if (currentRate > 1 || i === hardPity) currentRate = 1;
            
            let probThisPull = cumProb * currentRate;
            expPullsAny += i * probThisPull;
            cumProb *= (1 - currentRate);
        }
        
        // 大保底期望值 (馬可夫鏈狀態機)
        let expFiveStarsForUP = 0; let failProb = 1 - upRate; let tempExp = 0; let curChain = 1;
        for (let i = 1; i <= guarantee; i++) { tempExp += i * (curChain * upRate); curChain *= failProb; }
        expFiveStarsForUP = tempExp + (guarantee + 1) * curChain;
        const expPullsUP = expPullsAny * expFiveStarsForUP;

        document.getElementById('gacha-result').innerText = 
            `【泛用抽卡期望值分析】\n` +
            `當前保底模式: ${pityType === 'step' ? '逐步提升' : pityType === 'fixed' ? '單次固定提升' : '無軟保底'}\n` +
            `---------------------------\n` +
            `單出最高稀有度期望: ${expPullsAny.toFixed(2)} 抽\n` +
            `(綜合機率: ${(100/expPullsAny).toFixed(2)}%)\n\n` +
            `出特定大獎(UP)期望: ${expPullsUP.toFixed(2)} 抽\n` +
            `(大獎綜合機率: ${(100/expPullsUP).toFixed(2)}%)\n\n` +
            `---------------------------\n` +
            `投入 ${totalPulls} 抽預估收益：\n` +
            `🎯 總計金光數: ${(totalPulls/expPullsAny).toFixed(2)} 隻\n` +
            `👑 獲得【UP大獎】: ${(totalPulls/expPullsUP).toFixed(2)} 隻\n` +
            `🤡 歪出【小獎】: ${((totalPulls/expPullsAny) - (totalPulls/expPullsUP)).toFixed(2)} 隻`;
    }
</script>

</body>
</html>
