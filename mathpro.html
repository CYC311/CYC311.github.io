<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GrandAbyss Sovereign Engine | 終極科學與機率演算矩陣</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/11.8.0/math.js"></script>
    <style>
        :root {
            --bg-main: #090d16;
            --panel-bg: #131c2e;
            --panel-brd: #233554;
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
            --accent-blue: #38bdf8;
            --accent-green: #10b981;
            --accent-purple: #a855f7;
            --accent-orange: #f59e0b;
        }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background-color: var(--bg-main);
            color: var(--text-main);
            margin: 0; padding: 25px; line-height: 1.5;
        }
        .dashboard { max-width: 1300px; margin: 0 auto; }
        header { text-align: center; margin-bottom: 30px; border-bottom: 1px solid var(--panel-brd); padding-bottom: 20px; }
        header h1 { color: var(--accent-blue); margin: 0; font-size: 2.2em; letter-spacing: 3px; font-weight: 800; }
        header p { color: var(--text-muted); margin: 5px 0 0 0; font-size: 1em; }
        
        .nav-tabs { display: flex; gap: 10px; margin-bottom: 25px; border-bottom: 2px solid var(--panel-brd); overflow-x: auto; padding-bottom: 5px; }
        .tab-trigger {
            background: none; border: none; color: var(--text-muted); padding: 12px 24px; font-size: 1.05em;
            cursor: pointer; font-weight: 600; transition: all 0.2s ease; border-radius: 6px 6px 0 0;
        }
        .tab-trigger:hover { color: var(--text-main); background: rgba(255,255,255,0.02); }
        .tab-trigger.active { color: var(--accent-blue); border-bottom: 3px solid var(--accent-blue); background: rgba(56, 189, 248, 0.05); }
        
        .workspace { display: none; }
        .workspace.active { display: block; animation: viewRender 0.4s ease-out; }
        @keyframes viewRender { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        .grid-layout { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 25px; margin-bottom: 25px; }
        .card { background: var(--panel-bg); border: 1px solid var(--panel-brd); border-radius: 8px; padding: 20px; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.5); }
        .card h3 { margin-top: 0; font-size: 1.2em; border-bottom: 1px dashed var(--panel-brd); padding-bottom: 8px; margin-bottom: 15px; }
        .card h3.math-title { color: var(--accent-blue); }
        .card h3.sci-title { color: var(--accent-green); }
        .card h3.gacha-title { color: var(--accent-purple); }
        
        .form-group { margin-bottom: 12px; display: flex; flex-direction: column; gap: 5px; }
        .form-group label { font-size: 0.9em; font-weight: 600; color: #cbd5e1; }
        .form-group input, .form-group select, .form-group textarea {
            background: var(--bg-main); border: 1px solid var(--panel-brd); color: #fff;
            padding: 8px 12px; border-radius: 4px; font-family: 'Consolas', monospace; font-size: 0.95em; transition: 0.2s;
        }
        .form-group input:focus, .form-group select:focus { border-color: var(--accent-blue); outline: none; }
        
        .inline-group { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        
        .action-btn {
            background: var(--accent-blue); color: #000; border: none; padding: 12px; border-radius: 4px;
            font-weight: 700; cursor: pointer; width: 100%; transition: all 0.2s; font-size: 1em; margin-top: 10px;
        }
        .action-btn:hover { filter: brightness(1.1); transform: translateY(-1px); }
        .btn-green { background: var(--accent-green); color: #000; }
        .btn-purple { background: var(--accent-purple); color: #fff; }
        
        .console-box {
            background: #05070b; border-left: 4px solid var(--accent-blue); border-radius: 4px;
            padding: 15px; font-family: 'Consolas', 'Courier New', monospace; white-space: pre-wrap;
            font-size: 0.95em; line-height: 1.6; color: #e2e8f0; max-height: 400px; overflow-y: auto; box-shadow: inset 0 2px 4px rgba(0,0,0,0.8);
        }
        .card-wide { grid-column: 1 / -1; }
    </style>
</head>
<body>

<div class="dashboard">
    <header>
        <h1>GRANDABYSS SOVEREIGN ENGINE</h1>
        <p>學測核心學術運算與多維動態機率分析矩陣</p>
    </header>

    <div class="nav-tabs">
        <button class="tab-trigger active" onclick="activateTab('tab-math')">學測數學核心樞紐</button>
        <button class="tab-trigger" onclick="activateTab('tab-science')">物化科學核心樞紐</button>
        <button class="tab-trigger" onclick="activateTab('tab-gacha')">無極限動態抽卡引擎</button>
    </div>

    <div id="tab-math" class="workspace active">
        <div class="grid-layout">
            <div class="card">
                <h3 class="math-title">空間向量與幾何拓樸</h3>
                <div class="form-group">
                    <label>連心向量 P1P2 (x, y, z):</label>
                    <input type="text" id="v-p1p2" value="2, 3, -1">
                </div>
                <div class="form-group">
                    <label>直線 L1 方向向量 d1 (x, y, z):</label>
                    <input type="text" id="v-d1" value="1, -2, 2">
                </div>
                <div class="form-group">
                    <label>直線 L2 方向向量 d2 (x, y, z):</label>
                    <input type="text" id="v-d2" value="2, 1, -1">
                </div>
                <button class="action-btn" onclick="runVectorTopology()">幾何拓樸解析</button>
            </div>

            <div class="card">
                <h3 class="math-title">二維數據統計與迴歸線</h3>
                <div class="form-group">
                    <label>X 數據集 (以半形逗號分隔):</label>
                    <textarea id="st-x" rows="2">60, 65, 70, 75, 80</textarea>
                </div>
                <div class="form-group">
                    <label>Y 數據集 (以半形逗號分隔):</label>
                    <textarea id="st-y" rows="2">170, 172, 175, 178, 182</textarea>
                </div>
                <button class="action-btn" onclick="runStatisticalRegression()">執行最小平方法解析</button>
            </div>

            <div class="card">
                <h3 class="math-title">數列級數與金融複利模型</h3>
                <div class="inline-group">
                    <div class="form-group"><label>現金本金 (PV):</label><input type="number" id="fn-pv" value="10000"></div>
                    <div class="form-group"><label>年利率 (%):</label><input type="number" id="fn-rate" value="2.5" step="0.1"></div>
                </div>
                <div class="inline-group">
                    <div class="form-group"><label>期數 (年):</label><input type="number" id="fn-period" value="10"></div>
                    <div class="form-group">
                        <label>複利頻率:</label>
                        <select id="fn-type">
                            <option value="1">年複利 (n=1)</option>
                            <option value="12">月複利 (n=12)</option>
                            <option value="annuity">每期期初投入 (年金終值)</option>
                        </select>
                    </div>
                </div>
                <button class="action-btn" onclick="runFinancialMath()">計算級數生存期</button>
            </div>

            <div class="card card-wide">
                <div id="math-console" class="console-box" style="border-left-color: var(--accent-blue);">[System] 數學樞紐就緒。等待指令算力投入...</div>
            </div>
        </div>
    </div>

    <div id="tab-science" class="workspace">
        <div class="grid-layout">
            <div class="card">
                <h3 class="sci-title">力學：運動學與完全彈性碰撞</h3>
                <div class="inline-group">
                    <div class="form-group"><label>質量 m1 (kg):</label><input type="number" id="col-m1" value="3"></div>
                    <div class="form-group"><label>初速 v1 (m/s):</label><input type="number" id="col-v1" value="8"></div>
                </div>
                <div class="inline-group">
                    <div class="form-group"><label>質量 m2 (kg):</label><input type="number" id="col-m2" value="1"></div>
                    <div class="form-group"><label>初速 v2 (m/s):</label><input type="number" id="col-v2" value="-2"></div>
                </div>
                <button class="action-btn btn-green" onclick="runMechanicsCollision()">彈性碰撞動量解析</button>
            </div>

            <div class="card">
                <h3 class="sci-title">化學：氣體定律與理想計量</h3>
                <p style="font-size:0.82em; color:var(--text-muted); margin:0 0 8px 0;">反應物 A 莫耳數與 B 莫耳數，依係數比 1:2 反應生成 C。</p>
                <div class="inline-group">
                    <div class="form-group"><label>投入 A (mol):</label><input type="number" id="ch-na" value="1.5" step="0.1"></div>
                    <div class="form-group"><label>投入 B (mol):</label><input type="number" id="ch-nb" value="2.4" step="0.1"></div>
                </div>
                <div class="inline-group">
                    <div class="form-group"><label>反應容器體積 V (L):</label><input type="number" id="ch-vol" value="10"></div>
                    <div class="form-group"><label>環境溫度 T (K):</label><input type="number" id="ch-temp" value="300"></div>
                </div>
                <button class="action-btn btn-green" onclick="runChemicalStoichiometry()">限量試劑與壓力生成計算</button>
            </div>

            <div class="card">
                <h3 class="sci-title">不確定度與實驗誤差組合</h3>
                <div class="form-group">
                    <label>實驗多次測量序列 (A類計算基礎):</label>
                    <input type="text" id="unc-data" value="5.21, 5.24, 5.22, 5.20, 5.23">
                </div>
                <div class="form-group">
                    <label>儀器最小刻度誤差 (B類計算基礎):</label>
                    <input type="number" id="unc-b" value="0.01" step="0.001">
                </div>
                <button class="action-btn btn-green" onclick="runUncertaintyEngine()">誤差矩陣分析</button>
            </div>

            <div class="card card-wide">
                <div id="sci-console" class="console-box" style="border-left-color: var(--accent-green);">[System] 物理化學演算矩陣已掛載。</div>
            </div>
        </div>
    </div>

    <div id="tab-gacha" class="workspace">
        <div class="grid-layout">
            <div class="card">
                <h3 class="gacha-title">概率空間骨架設定</h3>
                <div class="inline-group">
                    <div class="form-group"><label>基礎抽取機率 (%):</label><input type="number" id="gc-base" value="0.6" step="0.1"></div>
                    <div class="form-group"><label>絕對硬保底 (抽):</label><input type="number" id="gc-hard" value="90"></div>
                </div>
                <div class="inline-group">
                    <div class="form-group"><label>特定大獎 UP 率 (%):</label><input type="number" id="gc-uprate" value="50"></div>
                    <div class="form-group"><label>連續大保底上限 (次):</label><input type="number" id="gc-max歪" value="1"></div>
                </div>
            </div>

            <div class="card">
                <h3 class="gacha-title">動態閾值變更 (Soft Pity)</h3>
                <div class="form-group">
                    <label>軟保底核心觸發模式:</label>
                    <select id="gc-pity-mode" onchange="togglePityUI()">
                        <option value="linear">線性逐步提升 (Linear Growth)</option>
                        <option value="fixed">單次斷崖固定提升 (Fixed Jump)</option>
                        <option value="exponential">指數型機率暴增 (Exponential)</option>
                        <option value="none">真空無軟保底機制 (Pure Hard Pity)</option>
                    </select>
                </div>
                <div class="inline-group">
                    <div class="form-group"><label>軟保底臨界抽數:</label><input type="number" id="gc-soft-start" value="73"></div>
                    <div class="form-group"><label id="pity-param-lbl">每步提升遞增值 (%):</label><input type="number" id="gc-soft-param" value="6.0" step="0.1"></div>
                </div>
            </div>

            <div class="card">
                <h3 class="gacha-title">算力資源投入預算</h3>
                <div class="form-group">
                    <label>預定投入總抽數資源:</label>
                    <input type="number" id="gc-budget" value="180">
                </div>
                <button class="action-btn btn-purple" onclick="runSovereignGachaEngine()">驅動機率矩陣解析</button>
            </div>

            <div class="card card-wide">
                <div id="gacha-console" class="console-box" style="border-left-color: var(--accent-purple);">[System] 泛用型動態機率矩陣就緒。請輸入參數以進行離散分佈期望值推演。</div>
            </div>
        </div>
    </div>
</div>

<script>
    // 視窗切換核心邏輯
    function activateTab(tabId) {
        document.querySelectorAll('.tab-trigger').forEach(btn => btn.classList.remove('active'));
        document.querySelectorAll('.workspace').forEach(panel => panel.classList.remove('active'));
        event.target.classList.add('active');
        document.getElementById(tabId).classList.add('active');
    }

    function togglePityUI() {
        const mode = document.getElementById('gc-pity-mode').value;
        const lbl = document.getElementById('pity-param-lbl');
        if(mode === 'linear') lbl.innerText = "每步提升遞增值 (%):";
        else if(mode === 'fixed') lbl.innerText = "變更後固定機率值 (%):";
        else if(mode === 'exponential') lbl.innerText = "指數增長底數因子:";
        else lbl.innerText = "此模式無效 (已關閉):";
    }

    function parseVector(str) {
        return str.split(',').map(Number);
    }

    // ==================== MATHEMATICS ENGINE LOGIC ====================
    function runVectorTopology() {
        try {
            const p1p2 = parseVector(document.getElementById('v-p1p2').value);
            const d1 = parseVector(document.getElementById('v-d1').value);
            const d2 = parseVector(document.getElementById('v-d2').value);

            if(p1p2.length!==3 || d1.length!==3 || d2.length!==3) throw new Error("維度不匹配，必須為三維空間坐標。");

            // 計算 3x3 行列式 (純量三重積)
            const det = math.det([p1p2, d1, d2]);
            // 計算 d1 x d2 外積
            const cp = math.cross(d1, d2);
            const cp_norm = math.norm(cp);

            let log = `【空間幾何幾何拓樸完整分析報告】\n`;
            log += `--------------------------------------------------\n`;
            log += `1. 方向向量外積 d1 x d2 = [${cp.map(n=>n.toFixed(2)).join(', ')}]\n`;
            log += `2. 平行六面體純量三重積 Det[P1P2, d1, d2] = ${det.toFixed(4)}\n\n`;

            if(Math.abs(cp_norm) < 1e-9) {
                log += `⚠️ 狀態警告：方向向量平行！直線 L1 與 L2 互相平行或重合。\n`;
            } else {
                if(Math.abs(det) < 1e-9) {
                    log += `✨ 拓樸狀態：Det = 0 且外積不為0。兩直線【共面且相交於一點】！\n`;
                    log += `   最短公垂距離 = 0\n`;
                } else {
                    const dist = Math.abs(det) / cp_norm;
                    log += `⚡ 拓樸狀態：兩直線處於【歪斜線 (Skew Lines)】幾何關係。\n`;
                    log += `   公垂線方向向量 = [${cp.map(n=>(n/cp_norm).toFixed(3)).join(', ')}] (已單位化)\n`;
                    log += `   ★ 最短距離公式 d = |(P1P2 · (d1 x d2))| / |d1 x d2|\n`;
                    log += `   🔥 歪斜線最短距離 = ${dist.toFixed(4)}\n`;
                }
            }
            document.getElementById('math-console').innerText = log;
        } catch(e) { document.getElementById('math-console').innerText = `[Error] ${e.message}`; }
    }

    function runStatisticalRegression() {
        try {
            const X = document.getElementById('st-x').value.split(',').map(Number);
            const Y = document.getElementById('st-y').value.split(',').map(Number);
            if(X.length !== Y.length || X.length < 2) throw new Error("數據維度不對等或樣本數小於 2。");

            const n = X.length;
            const meanX = math.mean(X), meanY = math.mean(Y);
            const stdX = math.std(X, 'uncorrected'), stdY = math.std(Y, 'uncorrected');

            let ssXX = 0, ssYY = 0, ssXY = 0;
            for(let i=0; i<n; i++) {
                ssXX += Math.pow(X[i] - meanX, 2);
                ssYY += Math.pow(Y[i] - meanY, 2);
                ssXY += (X[i] - meanX) * (Y[i] - meanY);
            }

            const r = ssXY / Math.sqrt(ssXX * ssYY);
            const slope = ssXY / ssXX;
            const intercept = meanY - slope * meanX;

            let log = `【學測二維數據統計與最小平方法分析】\n`;
            log += `--------------------------------------------------\n`;
            log += `樣本規模 n = ${n}\n`;
            log += `X 軸平均值 = ${meanX.toFixed(4)} | Y 軸平均值 = ${meanY.toFixed(4)}\n`;
            log += `X 軸標準差 (σx) = ${stdX.toFixed(4)} | Y 軸標準差 (飾y) = ${stdY.toFixed(4)}\n`;
            log += `--------------------------------------------------\n`;
            log += `🔥 相關係數 (Correlation Coefficient r) = ${r.toFixed(6)}\n`;
            
            if(Math.abs(r) >= 0.7) log += `   => 數據呈現 【高度正/負相關】\n`;
            else if(Math.abs(r) >= 0.3) log += `   => 數據呈現 【中度正/負相關】\n`;
            else log += `   => 數據呈現 【低度相關或無線性關係】\n`;

            log += `\n⚙️ 最小平方法迴歸直線 (Regression Line):\n`;
            log += `   斜率 (m) = r * (σy / σx) = ${slope.toFixed(6)}\n`;
            log += `   截距 (k) = ${intercept.toFixed(6)}\n`;
            log += `   👉 最佳擬合方程式: y = ${slope.toFixed(4)}x + (${intercept.toFixed(4)})\n`;

            document.getElementById('math-console').innerText = log;
        } catch(e) { document.getElementById('math-console').innerText = `[Error] ${e.message}`; }
    }

    function runFinancialMath() {
        const pv = parseFloat(document.getElementById('fn-pv').value);
        const rate = parseFloat(document.getElementById('fn-rate').value) / 100;
        const period = parseInt(document.getElementById('fn-period').value);
        const type = document.getElementById('fn-type').value;

        let log = `【級數展開與複利模型財務評估】\n`;
        log += `--------------------------------------------------\n`;

        if(type === 'annuity') {
            // 年金終值 Sn = P * [(1+r)^n - 1] / r * (1+r)
            let fv = pv * ((Math.pow(1 + rate, period) - 1) / rate) * (1 + rate);
            log += `模式：定期定額年金終值遞迴級數展開\n`;
            log += `每年期初投入金額 = ${pv.toFixed(2)}\n`;
            log += `累積 ${period} 年後級數總和 (FV) = ${fv.toFixed(2)}\n`;
            log += `投入原始本金和 = ${(pv * period).toFixed(2)} | 淨增生利息 = ${(fv - (pv * period)).toFixed(2)}\n`;
        } else {
            const n = parseInt(type);
            let fv = pv * Math.pow(1 + (rate / n), n * period);
            log += `模式：單一資產時間級數滾存\n`;
            log += `原始本金 = ${pv.toFixed(2)}\n`;
            log += `計息總期數 = ${n * period} 期\n`;
            log += `🔥 期末總資產結算 (FV) = ${fv.toFixed(2)}\n`;
        }
        document.getElementById('math-console').innerText = log;
    }

    // ==================== PHYSICAL SCIENCES LOGIC ====================
    function runMechanicsCollision() {
        const m1 = parseFloat(document.getElementById('col-m1').value);
        const v1 = parseFloat(document.getElementById('col-v1').value);
        const m2 = parseFloat(document.getElementById('col-m2').value);
        const v2 = parseFloat(document.getElementById('col-v2').value);

        const total_p_initial = m1*v1 + m2*v2;
        const total_k_initial = 0.5*m1*v1*v1 + 0.5*m2*v2*v2;

        // 完全彈性碰撞公式
        const v1_prime = ((m1 - m2) / (m1 + m2)) * v1 + ((2 * m2) / (m1 + m2)) * v2;
        const v2_prime = ((2 * m1) / (m1 + m2)) * v1 + ((m2 - m1) / (m1 + m2)) * v2;

        const total_p_final = m1*v1_prime + m2*v2_prime;
        const total_k_final = 0.5*m1*v1_prime*v1_prime + 0.5*m2*v2_prime*v2_prime;

        let log = `【一維完全彈性碰撞動量/能量矩陣守恆分析】\n`;
        log += `--------------------------------------------------\n`;
        log += `[初始狀態] 總動量 P = ${total_p_initial.toFixed(2)} kg·m/s | 總動能 Ek = ${total_k_initial.toFixed(2)} J\n\n`;
        log += `⚡ 碰撞後系統速度演變解算：\n`;
        log += `   質點 1 後續速度 v1' = ${v1_prime.toFixed(4)} m/s\n`;
        log += `   質點 2 後續速度 v2' = ${v2_prime.toFixed(4)} m/s\n\n`;
        log += `[末態驗證]\n`;
        log += `   碰撞後總動量 P' = ${total_p_final.toFixed(2)} kg·m/s (守恆驗證: 成功)\n`;
        log += `   碰撞後總動能 Ek' = ${total_k_final.toFixed(2)} J (彈性守恆驗證: 成功)\n`;
        log += `   質點相對接近速度 = ${(v1 - v2).toFixed(2)} m/s | 相對分離速度 = ${(v2_prime - v1_prime).toFixed(2)} m/s`;

        document.getElementById('sci-console').innerText = log;
    }

    function runChemicalStoichiometry() {
        const na = parseFloat(document.getElementById('ch-na').value);
        const nb = parseFloat(document.getElementById('ch-nb').value);
        const vol = parseFloat(document.getElementById('ch-vol').value);
        const temp = parseFloat(document.getElementById('ch-temp').value);
        const R = 0.08206;

        // 反應式： A + 2B -> C
        // 檢查限速試劑
        let potential_cycles_a = na / 1;
        let potential_cycles_b = nb / 2;
        
        let limiting = "";
        let consumed_a = 0, consumed_b = 0, produced_c = 0;

        if(potential_cycles_a <= potential_cycles_b) {
            limiting = "反應物 A";
            consumed_a = na;
            consumed_b = na * 2;
            produced_c = na;
        } else {
            limiting = "反應物 B";
            consumed_b = nb;
            consumed_a = nb / 2;
            produced_c = nb / 2;
        }

        const left_a = na - consumed_a;
        const left_b = nb - consumed_b;
        const total_gas_mol = left_a + left_b + produced_c; // 假設產物與反應物皆為氣態

        // PV = nRT -> P = nRT / V
        const pressure = (total_gas_mol * R * temp) / vol;

        let log = `【限量試劑消耗與理想氣體狀態方程聯立分析】\n`;
        log += `--------------------------------------------------\n`;
        log += `💀 系統極限判定：【${limiting}】為限量試劑 (Limiting Reagent)。\n\n`;
        log += `物資消耗與生成平衡表：\n`;
        log += `   [A] 剩餘 = ${left_a.toFixed(3)} mol\n`;
        log += `   [B] 剩餘 = ${left_b.toFixed(3)} mol\n`;
        log += `   [C] 生成 = ${produced_c.toFixed(3)} mol\n`;
        log += `   👉 氣相總莫耳數 n_total = ${total_gas_mol.toFixed(3)} mol\n\n`;
        log += `🎛️ 氣體狀態方程求解 (V = ${vol} L, T = ${temp} K):\n`;
        log += `   理想氣體常數 R = 0.08206 L·atm/(mol·K)\n`;
        log += `   🔥 反應平衡後期末總蒸汽壓 P = nRT/V = ${pressure.toFixed(4)} atm`;

        document.getElementById('sci-console').innerText = log;
    }

    function runUncertaintyEngine() {
        try {
            const data = document.getElementById('unc-data').value.split(',').map(Number).filter(n=>!isNaN(n));
            const ub_input = parseFloat(document.getElementById('unc-b').value);
            if(data.length < 2) throw new Error("A類不確定度要求測量次數至少 2 次以上。");

            const n = data.length;
            const mean = math.mean(data);
            const std = math.std(data, 'unbiased'); // 樣本標準差 S
            
            // Type A uncertainty
            const ua = std / Math.sqrt(n);
            // Type B uncertainty (學測/高階物理定義通常為 最小刻度 / (2*sqrt(3)) 或 最小刻度/sqrt(3) 依規範，此處採標準 B 類標準不確定度估計: 最小刻度/2)
            const ub = ub_input / 2;
            
            // Combined uncertainty
            const uc = Math.sqrt(ua*ua + ub*ub);

            let log = `【科學實驗高階不確定度複合矩陣報告】\n`;
            log += `--------------------------------------------------\n`;
            log += `實驗平均值 (X_avg) = ${mean.toFixed(5)}\n`;
            log += `樣本標準差 (S)     = ${std.toFixed(5)}\n\n`;
            log += `1. 📊 A 類標準不確定度 (隨機誤差 uA = S / √n)  = ${ua.toFixed(5)}\n`;
            log += `2. 📐 B 類標準不確定度 (儀器分度 uB = 刻度 / 2) = ${ub.toFixed(5)}\n`;
            log += `--------------------------------------------------\n`;
            log += `🔥 組合標準不確定度 (uc = √(uA² + uB²)) = ${uc.toFixed(5)}\n`;
            log += `👉 最終物理量實驗宣告: Y = ${mean.toFixed(4)} ± ${uc.toFixed(4)}\n`;

            document.getElementById('sci-console').innerText = log;
        } catch(e) { document.getElementById('sci-console').innerText = `[Error] ${e.message}`; }
    }

    // ==================== GACHA ENGINE LOGIC (SOVEREIGN MODEL) ====================
    function runSovereignGachaEngine() {
        try {
            const baseRate = parseFloat(document.getElementById('gc-base').value) / 100;
            const hardPity = parseInt(document.getElementById('gc-hard').value);
            const upRate = parseFloat(document.getElementById('gc-uprate').value) / 100;
            const max歪 = parseInt(document.getElementById('gc-max歪').value);
            const mode = document.getElementById('gc-pity-mode').value;
            const softStart = parseInt(document.getElementById('gc-soft-start').value);
            const softParam = parseFloat(document.getElementById('gc-soft-param').value);
            const budget = parseInt(document.getElementById('gc-budget').value);

            if(softStart >= hardPity && mode !== 'none') {
                throw new Error("軟保底起始點不可大於或等於硬保底限制。");
            }

            // 1. 建立單次出金的精確分佈 (PMF: Probability Mass Function)
            let pmfAny = new Array(hardPity + 1).fill(0);
            let cumSurvival = 1.0; // 尚未抽到的存活率

            for(let i = 1; i <= hardPity; i++) {
                let currentRate = baseRate;
                
                if(mode !== 'none' && i >= softStart) {
                    if(mode === 'linear') {
                        currentRate = baseRate + (i - softStart + 1) * (softParam / 100);
                    } else if(mode === 'fixed') {
                        currentRate = softParam / 100;
                    } else if(mode === 'exponential') {
                        currentRate = baseRate * Math.pow(softParam, i - softStart + 1);
                    }
                }

                if(currentRate > 1.0 || i === hardPity) currentRate = 1.0;

                pmfAny[i] = cumSurvival * currentRate;
                cumSurvival *= (1.0 - currentRate);
            }

            // 2. 計算單次金光的數學期望值
            let expectedPullsForAny = 0;
            for(let i = 1; i <= hardPity; i++) {
                expectedPullsForAny += i * pmfAny[i];
            }
            const consolidatedRateAny = 1 / expectedPullsForAny;

            // 3. 處理「歪保底狀態轉移（馬可夫鏈精確收斂）」
            // 設狀態為：已經連續歪了幾次。max歪代表最大連歪次數。
            // 建立方程式求解大獎平均需要幾隻五星
            // 此處實作通用大保底期望五星數求解：
            let expectedFiveStarsForUP = 0;
            let currentChainProb = 1.0;
            let tempExp = 0;

            for (let i = 1; i <= max歪; i++) {
                tempExp += i * (currentChainProb * upRate);
                currentChainProb *= (1.0 - upRate);
            }
            // 達到大保底極限次數，中大獎機率直接收斂至 100%
            tempExp += (max歪 + 1) * currentChainProb;
            expectedFiveStarsForUP = tempExp;

            const expectedPullsForUP = expectedPullsForAny * expectedFiveStarsForUP;
            const consolidatedRateUP = 1 / expectedPullsForUP;

            // 4. 動態模擬預算收益 (動態累積機率分佈 CDF)
            let cdfAnyBudget = 0;
            let tempSurvival = 1.0;
            // 粗估在投入預算內至少拿到一金的機率
            for(let i = 1; i <= Math.min(budget, hardPity); i++) {
                let rate = baseRate;
                if(mode !== 'none' && i >= softStart) {
                    if(mode === 'linear') rate = baseRate + (i - softStart + 1) * (softParam / 100);
                    else if(mode === 'fixed') rate = softParam / 100;
                    else if(mode === 'exponential') rate = baseRate * Math.pow(softParam, i - softStart + 1);
                }
                if(rate > 1 || i === hardPity) rate = 1;
                cdfAnyBudget += tempSurvival * rate;
                tempSurvival *= (1 - rate);
            }

            let log = `【無極限自訂型動態機率分析矩陣報告】\n`;
            log += `--------------------------------------------------\n`;
            log += `⚙️ 機制配置檔案：\n`;
            log += `   保底模式: ${mode} | 硬保底: ${hardPity} 抽 | UP率: ${(upRate*100).toFixed(1)}%\n`;
            log += `   大保底機制: 連續歪 ${max歪} 次後下次必出UP大獎\n`;
            log += `--------------------------------------------------\n`;
            log += `[1. 離散機率分佈收斂結果]\n`;
            log += `   👉 任意五星期望抽數: 平均 ${expectedPullsForAny.toFixed(2)} 抽出一金\n`;
            log += `   👉 任意五星綜合勝率 (含保底攤平): ${(consolidatedRateAny * 100).toFixed(4)}%\n\n`;
            log += `[2. 核心大獎 (UP) 指標]\n`;
            log += `   👉 平均需要抽到五星的數量: ${expectedFiveStarsForUP.toFixed(3)} 隻\n`;
            log += `   🔥 最終目標大獎期望抽數: 平均 ${expectedPullsForUP.toFixed(2)} 抽\n`;
            log += `   🔥 大獎精確綜合勝率: ${(consolidatedRateUP * 100).toFixed(4)}%\n\n`;
            log += `[3. 算力資源資源投資回報 (投入 ${budget} 抽)]\n`;
            log += `   📊 預算內「至少出貨一金」機率: ${(cdfAnyBudget * 100).toFixed(2)}%\n`;
            log += `   🎯 預期可獲得五星總數: ${(budget * consolidatedRateAny).toFixed(2)} 隻\n`;
            log += `   👑 預期可獲得【UP大獎】數: ${(budget * consolidatedRateUP).toFixed(2)} 隻\n`;
            log += `   ⚠️ 預期歪掉的【小獎】數: ${((budget * consolidatedRateAny) - (budget * consolidatedRateUP)).toFixed(2)} 隻\n`;
            log += `--------------------------------------------------\n`;
            log += `*註：本系統揚棄傳統隨機亂數模擬，採用嚴格的機率質量函數（PMF）極限求和，數據具備絕對學術精確度。`;

            document.getElementById('gacha-console').innerText = log;
        } catch(e) { document.getElementById('gacha-console').innerText = `[Error] ${e.message}`; }
    }
